services:
  polybot:
    build: .
    container_name: polybot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  dashboard:
    build: .
    container_name: polybot-dashboard
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "polybot", "dashboard", "--host", "0.0.0.0", "--port", "8080"]
    # Solo accesible desde el propio VPS; desde fuera usa un túnel SSH (ver README)
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data:ro
